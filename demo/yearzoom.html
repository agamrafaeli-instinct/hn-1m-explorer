<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Year zoom demo | HN explorer</title>
<link rel="stylesheet" href="../style.css"></head>
<body><main style="max-width:640px;margin:0 auto;padding:24px 20px">
<h1 style="font:800 26px Fraunces,Georgia,serif">Year zoom demo</h1>
<p class="lede">The shared year control from #206, on one chart: stories a month over every year of the archive. Charts on the site adopt it in #207 to #209.</p>
<div id="ctl"></div><h3 id="t" style="margin:16px 0 4px"></h3><div id="ch"></div>
<script src="../yearzoom.js"></script>
<script>
fetch('../data/atlas/months.json').then(function (r) { return r.json(); }).then(function (d) {
  var M = d.months.filter(function (m) { return m.stories; });
  var min = +M[0].month.slice(0, 4), max = +M[M.length - 1].month.slice(0, 4);
  var z = YearZoom.mount(document.getElementById('ctl'), { min: min, max: max });
  z.on(function (r) {
    var idx = YearZoom.pick(M.map(function (m) { return m.month; }), r), rows = idx.map(function (i) { return M[i]; });
    document.getElementById('t').textContent = 'Stories a month, ' + z.label();
    var W = 320, H = 150, pl = 8, pr = 46, pt = 10, pb = 22, n = rows.length, mx = Math.max.apply(null, rows.map(function (x) { return x.stories; }).concat([1]));
    var X = function (i) { return pl + (W - pl - pr) * (n > 1 ? i / (n - 1) : 0); }, Y = function (v) { return pt + (H - pt - pb) * (1 - v / mx); };
    var p = rows.map(function (x, i) { return (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(x.stories).toFixed(1); }).join('');
    var last = rows[n - 1];
    document.getElementById('ch').innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%" role="img" aria-label="Stories a month, ' + z.label() + ', latest ' + last.stories + '"><path d="' + p + '" fill="none" stroke="#b84700" stroke-width="2"/><text x="' + (X(n - 1) + 5) + '" y="' + (Y(last.stories) + 4) + '" font-size="11" font-weight="700" fill="#b84700">' + last.stories.toLocaleString() + '</text><text x="' + pl + '" y="' + (H - 4) + '" font-size="10" fill="#6b6157">' + rows[0].month + '</text><text x="' + (W - pr + 8) + '" y="' + (H - 4) + '" font-size="10" text-anchor="end" fill="#6b6157">' + last.month + '</text></svg>';
  });
});
</script></main></body></html>
