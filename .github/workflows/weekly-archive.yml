name: Weekly archive
# Second copy of data/weekly as a dated release asset (#220). Runs after the weekly snapshot finishes, or by hand.
on:
  workflow_run:
    workflows: ['Weekly snapshot']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the saved weeks, pack them and compare the pack
        run: |
          python scripts/verify_weekly.py
          D=$(date -u +%Y%m%d)
          python scripts/archive_weekly.py build weekly-$D.tar.gz
          python scripts/archive_weekly.py compare weekly-$D.tar.gz
          echo "ARCHIVE=weekly-$D.tar.gz" >> "$GITHUB_ENV"
          echo "TAG=weekly-archive-$D" >> "$GITHUB_ENV"
      - name: Publish the dated release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 && gh release delete "$TAG" --yes
          gh release create "$TAG" "$ARCHIVE" --title "Saved weeks $TAG" --notes "Second copy of data/weekly. Restore steps: docs/RESTORE.md"
