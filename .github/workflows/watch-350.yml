name: Daily HN 350+ points digest
on:
  schedule:
    - cron: '31 1 * * *'  # 08:31 Asia/Bangkok
  workflow_dispatch:
    inputs:
      note:
        description: 'Optional note'
        required: false
permissions:
  contents: write
concurrency:
  group: watch-350
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_watch_points
      - name: Find new 350+ point stories and write digest
        env:
          TZ: UTC
        run: python scripts/watch_points.py
      - name: Save state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alerts/
          if ! git diff --cached --quiet; then
            git commit -m 'Update 350-point alerts'
            for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
          fi
