name: Hypothesis PR check
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    name: Hypothesis PR check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cards only
        run: |
          base=origin/${{ github.base_ref }}
          bad=$(git diff --name-only $base...HEAD | grep -Ev '^hypotheses/h[0-9]{3}-[a-z0-9-]+\.json$' || true)
          if [ -n "$bad" ]; then
            echo "A card PR may only add one file named hypotheses/hNNN-short-name.json (lowercase letters, digits and dashes). These files do not fit:"; echo "$bad"
            { echo "## Card check"; echo; echo "- **Problem:** this PR changes files other than a card file, or a card file name does not look like hNNN-short-name.json."; echo "- **What to change:** remove these files from the PR, or rename the card:"; echo; echo '```'; echo "$bad"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Validate and evaluate cards
        run: node tests/hypotheses.test.js
      - name: Card rule messages and the worked example
        run: node tests/card_rules.test.js
      - name: Film card guard
        run: python3 -m unittest tests.test_film_guard
      - name: Story spec checks
        run: node tests/story_spec.test.js
  ui:
    name: UI check at 390px
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/ui.test.mjs
