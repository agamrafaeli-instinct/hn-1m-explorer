name: Daily Hacker News update and Pages
on:
  schedule:
    - cron: '23 2 * * *'  # 09:23 Asia/Bangkok daily
  push:
    branches: [main]
    paths: ['hypotheses/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hn-daily-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test data pipeline
        run: python -m unittest discover -s tests -v
      - name: Add new items and retain latest million
        run: python scripts/update_daily.py
      - name: Refresh curious-geeks numbers
        run: python scripts/geeks.py
      - name: Check the data before it is saved or published
        run: |
          set -o pipefail
          python scripts/data_checks.py | tee data_checks.txt
          { echo '### Data checks'; echo '```'; cat data_checks.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          rm data_checks.txt
      - name: Commit dataset atomically
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Update rolling HN dataset'
            # Fail rather than overwrite concurrent human changes. Next run catches up.
            git push origin HEAD:main
          fi
      - name: Stage only published site files
        run: python scripts/stage_site.py --output _site
      - name: Log today's verdicts
        run: |
          python scripts/verdict_log.py --tally _site/hypotheses/tally.json
          mkdir -p _site/data/verdicts
          cp data/verdicts/log.csv _site/data/verdicts/log.csv
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/verdicts/log.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Log card verdicts'
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
