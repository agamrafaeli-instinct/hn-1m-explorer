name: Daily Hacker News update and Pages
on:
  schedule:
    - cron: '23 2 * * *'  # 09:23 Asia/Bangkok daily
  push:
    branches: [main]
    paths: ['hypotheses/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hn-daily-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test data pipeline
        run: python -m unittest discover -s tests -v
      - name: Add new items and keep the rolling window
        run: python scripts/update_daily.py
      - name: Refresh curious-geeks numbers
        run: python scripts/geeks.py
      - name: Refresh film-card monthly shares
        run: |
          pip install duckdb
          python scripts/film.py shares
          python scripts/build_topic_series.py
      - name: Check the data before it is saved or published
        run: |
          set -o pipefail
          python scripts/data_checks.py | tee data_checks.txt
          { echo '### Data checks'; echo '```'; cat data_checks.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          rm data_checks.txt
      - name: Commit dataset atomically
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Update rolling HN dataset'
            # Rebase onto any commit that landed during the run (the bot only touches data/), then push. Never force.
            for i in 1 2 3; do
              git pull --rebase -q origin main && git push origin HEAD:main && break
              sleep 5
            done
            git diff --quiet origin/main HEAD -- data/ || { echo 'push failed after 3 tries'; exit 1; }
          fi
      - name: Stage only published site files
        run: python scripts/stage_site.py --output _site
      - name: Log today's verdicts
        run: |
          python scripts/verdict_log.py --tally _site/hypotheses/tally.json
          mkdir -p _site/data/verdicts
          cp data/verdicts/log.csv _site/data/verdicts/log.csv
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/verdicts/log.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Log card verdicts'
            git push origin HEAD:main
          fi
      - name: Honor scorecard (never fails the run)
        continue-on-error: true
        run: |
          python scripts/honor_scorecard.py | tee honor.txt
          { echo '### Honor scorecard'; cat honor.txt; } >> "$GITHUB_STEP_SUMMARY"
          rm honor.txt
          cp data/honor.json _site/data/honor.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/honor.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Honor scorecard'
            git push origin HEAD:main
          fi
      - name: Open "needs upgrade" issues (max 5 a day, never fails the run)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/honor_issues.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: UI check at 390px
        run: |
          set -o pipefail
          node tests/ui.test.mjs --serve _site | tee ui.txt
          { echo '### UI check (390px)'; echo '```'; cat ui.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          rm ui.txt
      - name: Check load time and size against budgets
        run: |
          set -o pipefail
          node scripts/perf.mjs --serve _site --runs 3 --tolerance 1.25 | tee perf.txt
          { echo '### Load budgets (slow 4G, 390px, time limit +25% for the CI machine)'; echo '```'; cat perf.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          rm perf.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
