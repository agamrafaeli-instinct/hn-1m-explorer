name: Daily Hacker News update and Pages
on:
  schedule:
    - cron: '23 2 * * *'  # 09:23 Asia/Bangkok daily
  push:
    branches: [main]
    # Only changes that alter the published site start a deploy (the allowlist in scripts/stage_site.py, plus the scripts that build staged files and this workflow). Docs, tests and other scripts do not.
    paths:
      - '*.html'
      - '*.js'
      - '*.mjs'
      - '*.css'
      - '*.json'
      - '*.svg'
      - '*.png'
      - '*.jpg'
      - '*.ico'
      - '*.webp'
      - 'data/**'
      - 'hypotheses/**'
      - 'stories/**'
      - 'vendor/**'
      - 'assets/**'
      - 'demo/**'
      - 'sample/**'
      - 'scripts/stage_site.py'
      - 'scripts/build_share_pages.py'
      - 'scripts/build_hyp_bundle.js'
      - '.github/workflows/daily-hn.yml'
      - '!source.json'
  workflow_dispatch:
    inputs:
      skip_unchanged:
        description: 'Skip checks whose inputs are unchanged (default: full run, skip nothing)'
        type: boolean
        default: false
      simulate_bad_day:
        description: 'Test only: break the data after the update to prove the quarantine path (#253)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: hn-daily-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Start from the newest main
        # A run queued behind another run (the group above) would otherwise start from the older commit it was triggered on and conflict with the data commits the first run pushed.
        run: |
          git fetch -q origin main
          git reset -q --hard origin/main
      - name: Did a passing prepush already check these exact files?
        id: pp
        # Only a push-triggered run may skip the repeat UI step (budgets always run, #250), and only when .prepush_ok matches these files. Scheduled and manual runs keep every check. Missing or stale marker means every check runs.
        run: |
          skip=false
          if [ "${{ github.event_name }}" = "push" ] && python3 scripts/prepush_digest.py --check; then skip=true; fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          # Full run (#252): every manual run and the Sunday scheduled run skip nothing. Other runs skip a check whose inputs are unchanged (scripts/build_graph.py).
          full=false
          if { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.skip_unchanged }}" != "true" ]; } || { [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%u)" = 7 ]; }; then full=true; fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Test data pipeline
        run: |
          pip install -r requirements-ci.txt
          python -m unittest discover -s tests -v
      - name: Check saved weeks against their recorded hashes
        # A saved week cannot be rebuilt once it leaves the archive window, so a missing or edited one fails the run the same day (#218).
        run: python scripts/verify_weekly.py
      - name: Add new items and keep the rolling window
        # Retries twice on its own (#253): a transient network failure heals without a person.
        run: bash scripts/retry.sh 3 python scripts/update_daily.py
      - name: Simulate a bad day (test only)
        if: inputs.simulate_bad_day == true
        run: python3 -c "import json;m=json.load(open('data/manifest.json'));m['total_rows']-=5;json.dump(m,open('data/manifest.json','w'),indent=1)"
      - name: Check the data contract
        id: contract
        # A break does not fail the run: the next step quarantines the day and the run carries on from the last good data (#253).
        run: |
          set +e
          python scripts/contract.py --base HEAD | tee contract.txt
          rc=${PIPESTATUS[0]}
          echo "bad=$([ "$rc" != 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Quarantine the day
        if: steps.contract.outputs.bad == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/quarantine.sh contract.txt "Data quarantined: contract broken, today's update was not saved"
      - name: Refresh curious-geeks numbers
        run: python scripts/geeks.py
      - name: Refresh film-card monthly shares
        # Skipped when the hash of everything these scripts read matches the last run (#243). A full run does not skip: if the hash said unchanged but an output differs, the run fails (stale skip).
        env:
          FULL: ${{ steps.pp.outputs.full }}
        run: |
          same=false; if python scripts/inputs_hash.py --check; then same=true; fi
          if [ "$same" = true ] && [ "$FULL" != true ]; then exit 0; fi
          pip install -r requirements-ci.txt
          python scripts/film.py shares
          python scripts/build_topic_series.py
          python scripts/rings_data.py
          python scripts/saga_data.py
          if [ "$same" = true ]; then
            git diff --quiet -- data/film_shares.json data/topic_series.json data/rings.json data/saga.json || { echo 'STALE SKIP: inputs hash unchanged but the outputs changed'; exit 1; }
          fi
          python scripts/inputs_hash.py --write
      - name: Find and publish today's story
        run: |
          pip install -r requirements-ci.txt
          python scripts/finder_candidates.py
          python scripts/finder_select.py
          pick=$(python -c "import json,datetime;print(json.load(open('data/finder/'+datetime.date.today().isoformat()+'.json'))['term'])" 2>/dev/null || true)
          if [ -n "$pick" ]; then python scripts/finder_dictionary.py term "$pick"; fi
          python scripts/finder_publish.py
      - name: Draft, check and publish weekly findings
        run: |
          python scripts/findings_draft.py
          python scripts/findings_publish.py
      - name: Check the data before it is saved or published
        id: dchecks
        # A failing check quarantines the day instead of stopping the run: today's update is dropped, an issue is opened, and the last good data is published (#253).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python scripts/data_checks.py | tee data_checks.txt
          rc=${PIPESTATUS[0]}
          { echo '### Data checks'; echo '```'; cat data_checks.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" != 0 ]; then bash scripts/quarantine.sh data_checks.txt "Data quarantined: a data check failed, today's update was not saved"; fi
          rm -f data_checks.txt contract.txt
          exit 0
      - name: Commit dataset atomically
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Update rolling HN dataset'
            # Rebase onto any commit that landed during the run (the bot only touches data/), then push. Never force.
            for i in 1 2 3; do
              git pull --rebase -q origin main && git push origin HEAD:main && break
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            git diff --quiet origin/main HEAD -- data/ || { echo 'push failed after 3 tries'; exit 1; }
          fi
      - name: Stage only published site files
        run: python scripts/stage_site.py --output _site
      - name: Log today's verdicts
        run: |
          python scripts/verdict_log.py --tally _site/hypotheses/tally.json
          mkdir -p _site/data/verdicts
          cp data/verdicts/log.csv _site/data/verdicts/log.csv
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/verdicts/log.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Log card verdicts'
            git push origin HEAD:main
          fi
      - name: Honor scorecard (never fails the run)
        continue-on-error: true
        run: |
          python scripts/honor_scorecard.py | tee honor.txt
          { echo '### Honor scorecard'; cat honor.txt; } >> "$GITHUB_STEP_SUMMARY"
          rm honor.txt
          cp data/honor.json _site/data/honor.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/honor.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Honor scorecard'
            git push origin HEAD:main
          fi
      - name: Open "needs upgrade" issues (max 5 a day, never fails the run)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/honor_issues.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: UI check at 390px
        # Skipped after a matching prepush (push runs), or when the site files are unchanged since the last good check and this is not a full run (#252).
        if: steps.pp.outputs.skip != 'true'
        env:
          FULL: ${{ steps.pp.outputs.full }}
        run: |
          set -o pipefail
          if [ "$FULL" != true ] && python3 scripts/build_graph.py check ui; then exit 0; fi
          node tests/ui.test.mjs --serve _site | tee ui.txt
          { echo '### UI check (390px)'; echo '```'; cat ui.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          rm ui.txt
          python3 scripts/build_graph.py record ui
      - name: Check load time and size against budgets
        # Always runs on push and full runs. A daily run (or a manual run with skip_unchanged) skips it when the site files and budgets are unchanged since the last good check (#252).
        env:
          FULL: ${{ steps.pp.outputs.full }}
          EVENT: ${{ github.event_name }}
        run: |
          set -o pipefail
          if [ "$EVENT" != push ] && [ "$FULL" != true ] && python3 scripts/build_graph.py check budgets; then exit 0; fi
          node scripts/perf.mjs --serve _site --runs 3 --tolerance 1.25 --trend perf_trend.csv | tee perf.txt
          { echo '### Load budgets (slow 4G, 390px). Size and request counts fail the run. Time only warns.'; echo '```'; cat perf.txt; echo '```'; echo 'Trend rows (date,source,page,ms,requests,kb):'; echo '```'; cat perf_trend.csv; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          rm perf.txt perf_trend.csv
          python3 scripts/build_graph.py record budgets
      - name: Save the build state
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/build_state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Save build state'
            for i in 1 2 3; do git pull --rebase -q origin main && git push origin HEAD:main && break; sleep 5; done
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
